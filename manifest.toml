packaging_format = 2

id = "prestashop"
name = "Prestashop"
description.en = "Create a E-commerce Website"
description.fr = "Créer un site ecommerce"

version = "9.1.0~ynh1"

maintainers = []

[upstream]
license = "OSL-3.0"
website = "https://prestashop.com"
demo = "https://demo.prestashop.com/#/en/front"
userdoc = "https://doc.prestashop.com/display/PS17/Guide+de+l'utilisateur"
code = "https://github.com/PrestaShop/PrestaShop"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/prestashop"

    [install.admin]
    type = "user"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        url = "https://github.com/PrestaShop/PrestaShop/archive/refs/tags/9.1.0.tar.gz"
        sha256 = "0c1582b0d95d9222b0060614bd3901ad9f6f16cf08832c22db4b8a1bf6598eac"
        in_subdir = false

        autoupdate.strategy = "latest_github_release"
        
    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "mariadb-server, php8.4-mbstring, php8.4-curl, php8.4-intl, php8.4-xmlrpc, php8.4-mysql, php8.4-gd, php8.4-xml, php8.4-cli, php8.4-zip"

    [resources.database]
    type = "mysql"
